name: ci

# Build the unit-test project and run the tests on every PR and push to develop.
# The test project targets net48 (MSTest) and references the VSSDK extension project,
# so it must be built with full MSBuild and run with VSTest — `dotnet test` cannot
# build the referenced classic VSIX project.

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (matching release.yml): a mutable
      # tag like @v4 lets whoever controls the tag change what runs in CI.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Restore
        run: msbuild ClaudeCode.sln -t:Restore -p:Configuration=Debug

      - name: Build test project
        run: >
          msbuild tests\ClaudeCode.VisualStudio.Tests\ClaudeCode.VisualStudio.Tests.csproj
          -t:Build -p:Configuration=Debug -p:DeployExtension=false -p:CreateVsixContainer=false

      - name: Run tests (VSTest)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -find "**\TestWindow\vstest.console.exe" | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found" }
          $dll = "tests\ClaudeCode.VisualStudio.Tests\bin\Debug\net48\ClaudeCode.VisualStudio.Tests.dll"
          & $vstest $dll
